<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Usuario - Gestor de Proyectos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .user-card {
            transition: all 0.2s ease;
        }
        .user-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .loader {
            border-top-color: #4f46e5;
            animation: spinner 0.6s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-slate-50 min-h-screen font-sans">

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 bg-white/80 z-50 flex items-center justify-center hidden">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
    </div>

    <div class="max-w-4xl mx-auto p-6">
        <!-- Header -->
        <div class="text-center mb-12 mt-8">
            <div class="inline-block p-3 bg-indigo-100 rounded-2xl mb-4">
                <svg class="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </div>
            <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight mb-2">¡Bienvenido!</h1>
            <p class="text-slate-500 text-lg">Selecciona tu usuario para continuar</p>
        </div>

        <!-- Lista de Usuarios -->
        <div id="users-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
            <!-- Los usuarios se cargarán aquí -->
        </div>

        <!-- Botón para ir a Admin -->
        <div class="text-center mt-8 pt-8 border-t border-slate-200">
            <p class="text-slate-500 mb-4">¿No encuentras tu usuario?</p>
            <a href="admin.html" class="inline-flex items-center gap-2 bg-white border border-indigo-200 hover:bg-indigo-50 text-indigo-600 px-6 py-3 rounded-xl font-semibold transition-all shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                </svg>
                Administrar Usuarios
            </a>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxmPBIboe_Evn45ZHjtkjydbmlPRMuSax_sEiTc2iN8cqqi2i4-Pf_lOd6875cQXEd_yg/exec';

        document.addEventListener('DOMContentLoaded', loadUsers);

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        async function loadUsers() {
            showLoading(true);
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                const users = (data.responsables || []).map(r => ({
                    id: r.id,
                    name: r.nombre,
                    email: r.email,
                    role: r.rol,
                    createdAt: r.fecha_registro
                }));
                
                const container = document.getElementById('users-container');
                
                if (users.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <p class="text-slate-400 text-lg mb-4">No hay usuarios registrados</p>
                            <a href="admin.html" class="inline-flex items-center gap-2 bg-indigo-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-indigo-700 transition-all">
                                Crear primer usuario
                            </a>
                        </div>
                    `;
                } else {
                    container.innerHTML = users.map(user => `
                        <div onclick="selectUser('${user.id}', '${user.name}', '${user.role}')" 
                             class="user-card bg-white rounded-xl shadow-sm border border-slate-200 p-6 cursor-pointer hover:border-indigo-300 hover:shadow-md transition-all">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xl">
                                    ${user.name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800">${user.name}</h3>
                                    <p class="text-sm text-slate-500">${user.email}</p>
                                    <span class="inline-block mt-1 text-xs px-2 py-0.5 rounded-full ${user.role === 'director' ? 'bg-purple-100 text-purple-600' : user.role === 'supervisor' ? 'bg-blue-100 text-blue-600' : 'bg-slate-100 text-slate-600'}">
                                        ${user.role}
                                    </span>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error cargando usuarios:', error);
                document.getElementById('users-container').innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500">
                        Error al cargar usuarios. Intenta de nuevo.
                    </div>
                `;
            } finally {
                showLoading(false);
            }
        }

        function selectUser(userId, userName, userRole) {
            // Guardar usuario en sessionStorage
            sessionStorage.setItem('currentUser', JSON.stringify({
                id: userId,
                name: userName,
                role: userRole
            }));
            
            // Redirigir a panel.html
            window.location.href = 'panel.html';
        }
    </script>
</body>
</html>
