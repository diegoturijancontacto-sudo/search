<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitios</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --card: #16161d;
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #0b0b0f, #0f0f16);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 24px;
    }

    .search-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11,11,15,0.85);
      backdrop-filter: blur(20px);
      padding-bottom: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-bar input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 14px;
      border: none;
      outline: none;
      background: var(--card);
      color: var(--text);
      font-size: 16px;
      transition: box-shadow .3s ease, transform .2s ease;
    }

    .search-bar input:focus {
      box-shadow: 0 0 0 2px var(--accent);
      transform: scale(1.01);
    }

    .btn-panel {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
    }

    .btn-panel:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-panel:active {
      transform: translateY(0);
    }

    ul.sites {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 16px;
    }

    .site-card {
      background: linear-gradient(180deg, #1a1a23, #14141c);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp .6s ease forwards;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .site-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .site-name {
      font-size: 20px;
      font-weight: 600;
    }

    /* ESTILOS PARA LAS ETIQUETAS DE ESTADO */
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .status-badge.checking {
      background: rgba(161, 161, 170, 0.15);
      color: #a1a1aa;
      border: 1px solid rgba(161, 161, 170, 0.2);
    }

    .status-badge.online {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-badge.internal {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .site-url {
      font-size: 14px;
      color: var(--accent);
      word-break: break-all;
    }

    .version-notes {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.5;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 40px;
      animation: fadeUp .6s ease forwards;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="search-bar">
      <input type="text" id="search" placeholder="Buscar sitio..." />
      <a href="panel.html" class="btn-panel">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line></svg>
        Panel
      </a>
    </div>

    <ul class="sites" id="sitesList"></ul>
    <div class="empty" id="empty" style="display:none;">No se encontraron sitios</div>
    <div style="text-align:center; padding: 16px 0 8px; font-size: 12px; color: #a1a1aa;">OPCore v1.3.0 &mdash; Desarrollado por Diego Turiján</div>
  </div>

  <script>
    let sitesData = [];

    async function loadSites() {
      try {
        const res = await fetch('db.json');
        sitesData = await res.json();
      } catch (e) {
        console.error('Error cargando db.json', e);
        // Fallback expandido para probar los estados
        sitesData = [
          { name: "Panel de Gestión", url: "panel.html", notes: "Acceso al tablero Kanban y diagrama de Gantt." },
          { name: "Google (Prueba Online)", url: "https://google.com", notes: "Este sitio debería marcar ONLINE." },
          { name: "Dominio Falso (Prueba Caído)", url: "https://este-dominio-seguro-no-existe-123.com", notes: "Este sitio debería marcar CAÍDO." }
        ];
      }

      // Inicializamos un ID y estado por defecto para cada sitio
      sitesData.forEach((site, index) => {
        site.id = index;
        site.status = 'checking'; 
      });

      renderSites(sitesData);
      checkAllStatuses(); // Iniciamos la comprobación en segundo plano
    }

    // Función para comprobar todos los sitios
    async function checkAllStatuses() {
      for (let site of sitesData) {
        // Si no es un enlace HTTP (ej. panel.html), lo marcamos como interno
        if (!site.url.startsWith('http')) {
          site.status = 'internal';
          updateBadgeDOM(site.id, site.status);
          continue;
        }

        try {
          // fetch con no-cors evita bloqueos del navegador. 
          // Si la promesa se resuelve (incluso con error 404), la red respondió = ONLINE.
          await fetch(site.url, { mode: 'no-cors', cache: 'no-cache' });
          site.status = 'online';
        } catch (error) {
          // Si hace catch, significa que la conexión falló (DNS caído, servidor apagado, etc.) = CAÍDO.
          site.status = 'offline';
        }
        
        // Actualizamos el DOM visualmente sin recargar toda la lista
        updateBadgeDOM(site.id, site.status);
      }
    }

    // Función para actualizar solo la etiqueta de estado en el HTML
    function updateBadgeDOM(id, status) {
      const badge = document.querySelector(`.status-badge[data-id="${id}"]`);
      if (badge) {
        badge.className = `status-badge ${status}`;
        if (status === 'online') badge.textContent = 'ONLINE';
        else if (status === 'offline') badge.textContent = 'CAÍDO';
        else if (status === 'internal') badge.textContent = 'LOCAL';
        else badge.textContent = 'Comprobando...';
      }
    }

    function renderSites(data) {
      const list = document.getElementById('sitesList');
      const empty = document.getElementById('empty');
      list.innerHTML = '';

      if (data.length === 0) {
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';

      data.forEach((site, index) => {
        const li = document.createElement('li');
        li.className = 'site-card';
        li.style.animationDelay = `${index * 0.05}s`;

        // Determinamos el texto actual del estado
        const statusText = site.status === 'online' ? 'ONLINE' :
                           site.status === 'offline' ? 'CAÍDO' :
                           site.status === 'internal' ? 'LOCAL' : 'Comprobando...';

        li.innerHTML = `
          <div class="site-header">
            <div class="site-name">${site.name}</div>
            <div class="status-badge ${site.status}" data-id="${site.id}">${statusText}</div>
          </div>
          <div class="site-url">${site.url}</div>
          <div class="version-notes">${site.notes}</div>
        `;

        li.addEventListener('click', () => {
          window.open(site.url, '_blank');
        });

        list.appendChild(li);
      });
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = sitesData.filter(s =>
        s.name.toLowerCase().includes(q) ||
        s.url.toLowerCase().includes(q) ||
        s.notes.toLowerCase().includes(q)
      );
      renderSites(filtered);
    });

    loadSites();
  </script>
</body>
</html>
