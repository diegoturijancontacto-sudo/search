<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitios</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --card: #16161d;
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #0b0b0f, #0f0f16);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 24px;
    }

    .search-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11,11,15,0.85);
      backdrop-filter: blur(20px);
      padding-bottom: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-bar input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 14px;
      border: none;
      outline: none;
      background: var(--card);
      color: var(--text);
      font-size: 16px;
      transition: box-shadow .3s ease, transform .2s ease;
    }

    .search-bar input:focus {
      box-shadow: 0 0 0 2px var(--accent);
      transform: scale(1.01);
    }

    .btn-panel {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
    }

    .btn-panel:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-panel:active {
      transform: translateY(0);
    }

    ul.sites {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 16px;
    }

    .site-card {
      background: linear-gradient(180deg, #1a1a23, #14141c);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp .6s ease forwards;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .site-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .site-name {
      font-size: 20px;
      font-weight: 600;
    }

    .site-url {
      font-size: 14px;
      color: var(--accent);
      word-break: break-all;
    }

    .version-notes {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.5;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 40px;
      animation: fadeUp .6s ease forwards;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="search-bar">
      <input type="text" id="search" placeholder="Buscar sitio..." />
      <a href="panel.html" class="btn-panel">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line></svg>
        Panel
      </a>
    </div>

    <ul class="sites" id="sitesList"></ul>
    <div class="empty" id="empty" style="display:none;">No se encontraron sitios</div>
    <div style="text-align:center; padding: 16px 0 8px; font-size: 12px; color: #a1a1aa;">OPCore v1.3.0 &mdash; Desarrollado por Diego Turiján</div>
  </div>

  <script>
    let sitesData = [];

    async function loadSites() {
      try {
        const res = await fetch('db.json');
        sitesData = await res.json();
        renderSites(sitesData);
      } catch (e) {
        console.error('Error cargando db.json', e);
        // Fallback para previsualización si db.json no existe localmente
        sitesData = [
          { name: "Panel de Gestión", url: "panel.html", notes: "Acceso al tablero Kanban y diagrama de Gantt." }
        ];
        renderSites(sitesData);
      }
    }

    function renderSites(data) {
      const list = document.getElementById('sitesList');
      const empty = document.getElementById('empty');
      list.innerHTML = '';

      if (data.length === 0) {
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';

      data.forEach((site, index) => {
        const li = document.createElement('li');
        li.className = 'site-card';
        li.style.animationDelay = `${index * 0.05}s`;

        li.innerHTML = `
          <div class="site-header">
            <div class="site-name">${site.name}</div>
          </div>
          <div class="site-url">${site.url}</div>
          <div class="version-notes">${site.notes}</div>
        `;

        li.addEventListener('click', () => {
          window.open(site.url, '_blank');
        });

        list.appendChild(li);
      });
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = sitesData.filter(s =>
        s.name.toLowerCase().includes(q) ||
        s.url.toLowerCase().includes(q) ||
        s.notes.toLowerCase().includes(q)
      );
      renderSites(filtered);
    });

    loadSites();
  </script>
</body>
</html>
