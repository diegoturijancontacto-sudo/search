<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Proyectos | Vercel & Apps Script</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-indigo-900 tracking-tight">Gestión de Proyectos</h1>
                <p class="text-slate-500">Los datos se sincronizan con Google Sheets</p>
            </div>
            <button onclick="document.getElementById('modal').classList.remove('hidden')" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-semibold shadow-lg transition-all transform hover:scale-105 active:scale-95">
                + Nuevo Proyecto
            </button>
        </header>

        <!-- Tablero -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Proyectos en Curso -->
            <div class="flex flex-col gap-4">
                <div class="flex items-center gap-2 px-2">
                    <div class="w-3 h-3 rounded-full bg-blue-500"></div>
                    <h2 class="font-bold text-slate-700 uppercase text-xs">En Curso</h2>
                </div>
                <div id="en-curso" class="kanban-list bg-slate-200/50 p-3 rounded-2xl min-h-[500px] border-2 border-transparent transition-colors" data-status="en-curso"></div>
            </div>

            <!-- Proyectos en Pausa -->
            <div class="flex flex-col gap-4">
                <div class="flex items-center gap-2 px-2">
                    <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                    <h2 class="font-bold text-slate-700 uppercase text-xs">En Pausa</h2>
                </div>
                <div id="en-pausa" class="kanban-list bg-slate-200/50 p-3 rounded-2xl min-h-[500px] border-2 border-transparent transition-colors" data-status="en-pausa"></div>
            </div>

            <!-- Proyectos Terminados -->
            <div class="flex flex-col gap-4">
                <div class="flex items-center gap-2 px-2">
                    <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                    <h2 class="font-bold text-slate-700 uppercase text-xs">Terminados</h2>
                </div>
                <div id="terminados" class="kanban-list bg-slate-200/50 p-3 rounded-2xl min-h-[500px] border-2 border-transparent transition-colors" data-status="terminados"></div>
            </div>
        </div>
    </div>

    <!-- Modal Formulario -->
    <div id="modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="p-6 bg-indigo-50 border-b border-indigo-100">
                <h3 class="text-xl font-bold text-indigo-900">Detalles del Proyecto</h3>
            </div>
            <form id="projectForm" class="p-6 space-y-4">
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-slate-600 ml-1">Nombre del Proyecto</label>
                    <input type="text" id="pName" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all">
                </div>
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-slate-600 ml-1">Responsable</label>
                    <input type="text" id="pLead" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all">
                </div>
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-slate-600 ml-1">Fase Inicial</label>
                    <select id="pStatus" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all appearance-none bg-white">
                        <option value="en-curso">En Curso</option>
                        <option value="en-pausa">En Pausa</option>
                        <option value="terminados">Terminado</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="document.getElementById('modal').classList.add('hidden')" class="px-5 py-2 text-slate-500 font-medium hover:bg-slate-100 rounded-xl transition-colors">Cancelar</button>
                    <button type="submit" class="px-8 py-2 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        /**
         * SEGURIDAD: Intentamos leer la URL de una variable de entorno de Vercel.
         * Si no existe (desarrollo local), puedes poner tu URL aquí temporalmente.
         */
        const SCRIPT_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? "TU_URL_DE_APPS_SCRIPT_AQUI" 
            : NEXT_PUBLIC_SCRIPT_URL;

        // Inicializar Drag and Drop
        const columns = ['en-curso', 'en-pausa', 'terminados'];
        columns.forEach(id => {
            const el = document.getElementById(id);
            new Sortable(el, {
                group: 'kanban',
                animation: 200,
                ghostClass: 'bg-indigo-50',
                chosenClass: 'rotate-2',
                dragClass: 'opacity-0',
                onEnd: (evt) => {
                    const projectId = evt.item.dataset.id;
                    const newStatus = evt.to.id;
                    updateProjectStatus(projectId, newStatus);
                }
            });
        });

        // Evento Formulario
        document.getElementById('projectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const project = {
                id: 'id-' + Date.now(),
                name: document.getElementById('pName').value,
                lead: document.getElementById('pLead').value,
                status: document.getElementById('pStatus').value
            };
            
            renderCard(project);
            syncData(project, 'create');
            document.getElementById('modal').classList.add('hidden');
            this.reset();
        });

        function renderCard(p) {
            const card = document.createElement('div');
            card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 cursor-grab active:cursor-grabbing hover:border-indigo-300 transition-all group";
            card.dataset.id = p.id;
            card.innerHTML = `
                <h4 class="font-bold text-slate-800 mb-2 group-hover:text-indigo-600 transition-colors">${p.name}</h4>
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-[10px] font-bold text-indigo-600">
                        ${p.lead.substring(0,2).toUpperCase()}
                    </div>
                    <span class="text-xs text-slate-500 font-medium">Resp: ${p.lead}</span>
                </div>
            `;
            document.getElementById(p.status).appendChild(card);
        }

        async function syncData(data, action) {
            if (SCRIPT_URL.includes("TU_URL")) return; // No hacer nada si no hay URL

            try {
                // Apps Script con doPost requiere enviar datos como JSON string
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, data })
                });
                console.log("Sincronizado con Google Sheets");
            } catch (error) {
                console.error("Error de red:", error);
            }
        }

        function updateProjectStatus(id, status) {
            syncData({ id, status }, 'update');
        }
    </script>
</body>
</html>
