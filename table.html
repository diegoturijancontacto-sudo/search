<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Proyectos Kanban</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drag-over {
            border: 2px dashed #4f46e5;
            background-color: #f5f3ff;
        }
        .project-card:active {
            cursor: grabbing;
        }
        /* Animación de carga */
        .loader {
            border-top-color: #4f46e5;
            animation: spinner 0.6s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <!-- Indicador de Carga Global -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white bg-opacity-70 z-[100] hidden flex flex-col items-center justify-center">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
        <p class="text-indigo-600 font-semibold">Sincronizando...</p>
    </div>

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Panel de Proyectos</h1>
                <p class="text-gray-600">Organiza tus tareas arrastrando y soltando</p>
            </div>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg transition duration-200 shadow-lg">
                + Nuevo Proyecto
            </button>
        </header>

        <!-- Tablero Kanban -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- En Curso -->
            <div class="flex flex-col h-full">
                <div class="bg-blue-600 text-white p-3 rounded-t-lg font-bold flex justify-between items-center">
                    <span>EN CURSO</span>
                    <span id="count-curso" class="bg-blue-500 text-xs px-2 py-1 rounded-full">0</span>
                </div>
                <div id="curso" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" class="kanban-column flex-1 bg-white p-4 rounded-b-lg shadow-sm min-h-[500px] transition-colors border-2 border-transparent">
                </div>
            </div>

            <!-- En Pausa -->
            <div class="flex flex-col h-full">
                <div class="bg-yellow-500 text-white p-3 rounded-t-lg font-bold flex justify-between items-center">
                    <span>EN PAUSA</span>
                    <span id="count-pausa" class="bg-yellow-400 text-xs px-2 py-1 rounded-full">0</span>
                </div>
                <div id="pausa" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" class="kanban-column flex-1 bg-white p-4 rounded-b-lg shadow-sm min-h-[500px] transition-colors border-2 border-transparent">
                </div>
            </div>

            <!-- Terminados -->
            <div class="flex flex-col h-full">
                <div class="bg-green-600 text-white p-3 rounded-t-lg font-bold flex justify-between items-center">
                    <span>TERMINADO</span>
                    <span id="count-terminado" class="bg-green-500 text-xs px-2 py-1 rounded-full">0</span>
                </div>
                <div id="terminado" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" class="kanban-column flex-1 bg-white p-4 rounded-b-lg shadow-sm min-h-[500px] transition-colors border-2 border-transparent">
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Nuevo/Editar Proyecto -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
            <h2 id="modalTitle" class="text-xl font-bold mb-4">Añadir Nuevo Proyecto</h2>
            <input type="hidden" id="projId">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre del Proyecto</label>
                    <input type="text" id="projName" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Responsable</label>
                    <input type="text" id="projOwner" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="Ej: Juan Pérez">
                </div>
                <div id="statusContainer">
                    <label class="block text-sm font-medium text-gray-700">Estado Inicial</label>
                    <select id="projStatus" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="curso">En Curso</option>
                        <option value="pausa">En Pausa</option>
                        <option value="terminado">Terminado</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800">Cancelar</button>
                    <button onclick="saveProject()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxJpPgkX8dUfMkZBgrNTnMqJMJRyjwz82jA2Ho05yvahbrRfyZagoHMnbQo7Qch8CT9lw/exec'; 

        let projects = [];

        window.onload = () => {
            fetchProjects();
        };

        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) overlay.classList.remove('hidden');
            else overlay.classList.add('hidden');
        }

        function fetchProjects() {
            if (!WEB_APP_URL) {
                projects = [
                    { id: '1', name: 'Rediseño Web', owner: 'Ana García', status: 'curso' },
                    { id: '2', name: 'Inventario Q1', owner: 'Luis Torres', status: 'pausa' }
                ];
                renderBoard();
                return;
            }

            showLoading(true);
            fetch(WEB_APP_URL)
                .then(res => res.json())
                .then(data => {
                    projects = data;
                    renderBoard();
                })
                .catch(err => console.error("Error al cargar datos:", err))
                .finally(() => showLoading(false));
        }

        function renderBoard() {
            const columns = ['curso', 'pausa', 'terminado'];
            columns.forEach(col => {
                const container = document.getElementById(col);
                container.innerHTML = '';
                const filtered = projects.filter(p => p.status === col);
                document.getElementById(`count-${col}`).innerText = filtered.length;

                filtered.forEach(proj => {
                    const card = document.createElement('div');
                    card.className = 'project-card group bg-gray-50 p-4 mb-3 rounded-lg border border-gray-200 shadow-sm cursor-grab hover:shadow-md transition duration-200 relative';
                    card.draggable = true;
                    card.id = `proj-${proj.id}`;
                    card.dataset.id = proj.id;
                    card.ondragstart = drag;
                    
                    card.innerHTML = `
                        <div class="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editProject('${proj.id}')" class="text-gray-400 hover:text-indigo-600 p-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </button>
                            <button onclick="deleteProject('${proj.id}')" class="text-gray-400 hover:text-red-500 p-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                        <h3 class="font-bold text-gray-800 pr-12">${proj.name}</h3>
                        <p class="text-sm text-gray-500 mt-2 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            ${proj.owner}
                        </p>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function dragLeave(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.dataset.id);
        }

        function drop(ev) {
            ev.preventDefault();
            const container = ev.currentTarget;
            container.classList.remove('drag-over');
            
            const projectId = ev.dataTransfer.getData("text");
            const newStatus = container.id;

            const project = projects.find(p => p.id == projectId);
            if (project && project.status !== newStatus) {
                project.status = newStatus;
                updateProjectInSheets(project);
                renderBoard();
            }
        }

        function openModal(isEdit = false, projData = null) {
            document.getElementById('modal').classList.remove('hidden');
            const title = document.getElementById('modalTitle');
            const statusContainer = document.getElementById('statusContainer');
            
            if (isEdit && projData) {
                title.innerText = "Editar Proyecto";
                document.getElementById('projId').value = projData.id;
                document.getElementById('projName').value = projData.name;
                document.getElementById('projOwner').value = projData.owner;
                statusContainer.classList.add('hidden'); // No cambiamos estado desde el modal para no confundir con el drag&drop
            } else {
                title.innerText = "Añadir Nuevo Proyecto";
                document.getElementById('projId').value = '';
                document.getElementById('projName').value = '';
                document.getElementById('projOwner').value = '';
                statusContainer.classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function editProject(id) {
            const project = projects.find(p => p.id == id);
            if (project) {
                openModal(true, project);
            }
        }

        function saveProject() {
            const id = document.getElementById('projId').value;
            const name = document.getElementById('projName').value;
            const owner = document.getElementById('projOwner').value;
            
            if (!name || !owner) {
                alert("Por favor rellena todos los campos");
                return;
            }

            if (id) {
                // Modo Edición
                const project = projects.find(p => p.id == id);
                project.name = name;
                project.owner = owner;
                updateProjectInSheets(project, 'full_update');
            } else {
                // Modo Nuevo
                const status = document.getElementById('projStatus').value;
                const newProj = {
                    id: Date.now().toString(),
                    name: name,
                    owner: owner,
                    status: status
                };
                projects.push(newProj);
                saveProjectToSheets(newProj);
            }

            renderBoard();
            closeModal();
        }

        function deleteProject(id) {
            if (!confirm('¿Estás seguro de que deseas eliminar este proyecto?')) return;
            
            projects = projects.filter(p => p.id != id);
            renderBoard();
            
            if (!WEB_APP_URL) return;
            
            showLoading(true);
            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'delete', data: { id: id } })
            })
            .finally(() => showLoading(false));
        }

        function saveProjectToSheets(proj) {
            if (!WEB_APP_URL) return;
            
            showLoading(true);
            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'add', data: proj })
            })
            .finally(() => showLoading(false));
        }

        function updateProjectInSheets(proj, updateType = 'status_only') {
            if (!WEB_APP_URL) return;

            showLoading(true);
            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'update', 
                    type: updateType,
                    data: proj 
                })
            })
            .finally(() => showLoading(false));
        }
    </script>
</body>
</html>
