  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      transition: background-color .2s ease, color .2s ease; 
      -webkit-tap-highlight-color: transparent;

    }
    .glass-nav {

      0%, 100% { transform: scaleY(0.3); opacity: 0.5; }

      border-radius: 24px;

      padding: 28px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);

    .dark .prov-modal {
      background: #1e293b;
      border: 1px solid #334155;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }

      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;

    }

</head>

    const PROVENANCE_ABREVIATURAS = {

    };

    // --- CATÁLOGO DE TIPOS DE ADJUNTO Y CÓDIGOS ---
    const TIPOS_ADJUNTO = [
      { code: 'RW', label: 'Imagen Original (RW)' },
      { code: 'RD', label: 'Imagen Editada (RD)' },
      { code: 'FO', label: 'Foto de la Obra (FO)' },
      { code: 'VD', label: 'Video (VD)' },
      { code: 'CER', label: 'Certificado (CER)' },

    ];

    // --- FUNCIÓN DE GENERACIÓN DE CLAVE EXACTA ---
    function generateClave(provenanceName, artista, tecnica, claveActual, allRegistrosObra = []) {
        let numStr = '0001';

        if (claveActual && claveActual.length >= 4) {
            numStr = claveActual.substring(0, 4);
        } else {
            if (allRegistrosObra && allRegistrosObra.length > 0) {
                let maxBloque1 = 0;
                allRegistrosObra.forEach(obra => {
                    if (obra.clave) {
                        const numeroActual = parseInt(obra.clave.substring(0, 4), 10);
                        if (!isNaN(numeroActual) && numeroActual > maxBloque1) {
                            maxBloque1 = numeroActual;
                        }
                    }
                });
                numStr = String(maxBloque1 + 1).padStart(4, '0');
            }
        }

        // --- BLOQUE 1: PROVENANCE ---
        let provStr = 'RTB'; // Valor por defecto
        
        if (provenanceName && provenanceName.trim() !== '') {
            const cleanProv = provenanceName.trim();
            
            let abreviaturaEncontrada = null;
            const provLower = cleanProv.toLowerCase();
            
            for (const [nombreProv, abreviatura] of Object.entries(PROVENANCE_ABREVIATURAS)) {
                if (nombreProv.toLowerCase() === provLower || provLower.includes(nombreProv.toLowerCase()) || nombreProv.toLowerCase().includes(provLower)) {
                    abreviaturaEncontrada = abreviatura;
                    break;
                }
            }
            
            if (abreviaturaEncontrada) {
                provStr = abreviaturaEncontrada;
            } else {
                const cleanProvFallback = cleanProv.replace(/\s+/g, '').toUpperCase();
                if (cleanProvFallback.length > 0) {
                    provStr = cleanProvFallback.substring(0, 3).padEnd(3, 'X');
                }
            }
        }

        const bloque1 = `${numStr}${provStr}`;

        // --- BLOQUE 2: AUTOR ---
        let artistStr = '';
        if (artista && artista.trim() !== '') {
            const cleanArtista = artista.trim();
            let abreviaturaEncontrada = null;
            const artistaLower = cleanArtista.toLowerCase();
            
            for (const [nombreAutor, abreviatura] of Object.entries(AUTOR_ABREVIATURAS)) {
                if (nombreAutor.toLowerCase() === artistaLower) {
                    abreviaturaEncontrada = abreviatura;
                    break;
                }
            }
            
            if (abreviaturaEncontrada) {
                artistStr = abreviaturaEncontrada;
            } else {
                const wordsArtista = cleanArtista.split(/\s+/);
                const pNombre = wordsArtista[0] || '';
                const sNombre = wordsArtista[1] || '';

                const iniP1 = pNombre.charAt(0).toUpperCase();
                const iniS2 = sNombre.substring(0, 2).toUpperCase();

                artistStr = `${iniP1}${iniS2}`;
            }
        }

        // --- BLOQUE 3: TÉCNICA ---
        let tecStr = '';
        if (tecnica && tecnica.trim() !== '') {
            const cleanTecnica = tecnica.trim();
            let abreviaturaEncontrada = null;
            const tecLower = cleanTecnica.toLowerCase();
            
            for (const [nombreTec, abreviatura] of Object.entries(TECNICA_ABREVIATURAS)) {
                if (nombreTec.toLowerCase() === tecLower || tecLower.includes(nombreTec.toLowerCase()) || nombreTec.toLowerCase().includes(tecLower)) {
                    abreviaturaEncontrada = abreviatura;
                    break;
                }
            }
            
            if (abreviaturaEncontrada) {
                tecStr = abreviaturaEncontrada;
            } else {
                const wordsTec = cleanTecnica.split(/\s+/);
                const pPalabraTec = wordsTec[0] || '';

                if (pPalabraTec.length >= 3) {
                    const p2 = pPalabraTec.substring(0, 2).toUpperCase();
                    const ult = pPalabraTec.charAt(pPalabraTec.length - 1).toUpperCase();
                    tecStr = `${p2}${ult}`;
                } else {
                    tecStr = pPalabraTec.toUpperCase().padEnd(3, 'X');
                }
            }
        }

        const bloque2 = `${artistStr}${tecStr}`;

        if (bloque2 !== '') {
            return `${bloque1}-${bloque2}`;
        }
        return bloque1;
    }

    // --- COMPONENTE DE AUTOCOMPLETADO ---
    function AutocompleteInput({ 
      value, 
      onChange, 
      suggestions, 
      placeholder, 
      label,
      onSuggestionSelect 
    }) {
      const [showSuggestions, setShowSuggestions] = useState(false);
      const [filteredSuggestions, setFilteredSuggestions] = useState([]);
      const [selectedIndex, setSelectedIndex] = useState(-1);
      const wrapperRef = useRef(null);
      const inputRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
            setShowSuggestions(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      useEffect(() => {
        if (value && value.trim().length > 0) {
          const lowerValue = value.toLowerCase().trim();
          const filtered = suggestions.filter(s => 
            s.toLowerCase().includes(lowerValue)
          );
          setFilteredSuggestions(filtered);
          setShowSuggestions(filtered.length > 0);
        } else {
          setFilteredSuggestions([]);
          setShowSuggestions(false);
        }
        setSelectedIndex(-1);
      }, [value, suggestions]);

      const handleKeyDown = (e) => {
        if (!showSuggestions) return;
        
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setSelectedIndex(prev => 
            prev < filteredSuggestions.length - 1 ? prev + 1 : prev
          );
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setSelectedIndex(prev => prev > 0 ? prev - 1 : -1);
        } else if (e.key === 'Enter' && selectedIndex >= 0) {
          e.preventDefault();
          handleSelectSuggestion(filteredSuggestions[selectedIndex]);
        } else if (e.key === 'Escape') {
          setShowSuggestions(false);
        }
      };

      const handleSelectSuggestion = (suggestion) => {
        onChange(suggestion);
        setShowSuggestions(false);
        if (onSuggestionSelect) onSuggestionSelect(suggestion);
        inputRef.current?.focus();
      };

      const highlightMatch = (text, query) => {
        if (!query || !query.trim()) return text;
        const lowerText = text.toLowerCase();
        const lowerQuery = query.toLowerCase().trim();
        const index = lowerText.indexOf(lowerQuery);
        if (index === -1) return text;
        return (
          <>
            {text.substring(0, index)}
            <span className="suggestion-highlight">
              {text.substring(index, index + query.length)}
            </span>
            {text.substring(index + query.length)}
          </>
        );
      };

      return (
        <div className="suggestion-wrapper" ref={wrapperRef}>
          <label className="text-[10px] font-bold text-slate-400 uppercase ml-1 block mb-1">
            {label}
          </label>
          <input
            ref={inputRef}
            type="text"
            placeholder={placeholder}
            className="w-full p-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
            value={value || ''}
            onChange={(e) => {
              onChange(e.target.value);
              if (onSuggestionSelect) onSuggestionSelect(e.target.value);
            }}
            onKeyDown={handleKeyDown}
            onFocus={() => {
              if (value && value.trim().length > 0 && filteredSuggestions.length > 0) {
                setShowSuggestions(true);
              }
            }}
          />
          {showSuggestions && filteredSuggestions.length > 0 && (
            <div className="suggestions-dropdown">
              {filteredSuggestions.map((suggestion, index) => (
                <div
                  key={suggestion}
                  className={`suggestion-item ${index === selectedIndex ? 'bg-slate-100 dark:bg-slate-700' : ''}`}
                  onClick={() => handleSelectSuggestion(suggestion)}
                  onMouseEnter={() => setSelectedIndex(index)}
                >
                  {highlightMatch(suggestion, value)}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- COMPONENTE DE INPUT DE PRECIO CON FORMATO ---
    function PriceInput({ value, onChange, currency, label }) {
      const [displayValue, setDisplayValue] = useState('');
      const [isEditing, setIsEditing] = useState(false);

      const formatPrice = (inputValue) => {
        const num = parseFloat(String(inputValue).replace(/,/g, ''));
        if (Number.isNaN(num)) return '';
        return new Intl.NumberFormat('es-MX', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(num);
      };

      useEffect(() => {
        if (isEditing) {
          return;
        }
        if (value !== undefined && value !== null && value !== '') {
          setDisplayValue(formatPrice(value));
        } else {
          setDisplayValue('');
        }
      }, [value, isEditing]);

      const handleBlur = () => {
        setIsEditing(false);
        if (!displayValue) {
          onChange('');
          return;
        }

        const clean = displayValue.replace(/,/g, '');
        const num = parseFloat(clean);
        if (!Number.isNaN(num)) {
          const formatted = formatPrice(num);
          setDisplayValue(formatted);
          onChange(num.toString());
        }
      };

      const handleChange = (e) => {
        const raw = e.target.value;
        setDisplayValue(raw);
        onChange(raw);
      };

      // Obtener el símbolo de la moneda
      const getCurrencySymbol = (curr) => {
        switch(curr) {
          case 'USD': return 'USD $';
          case 'EUR': return '€';
          case 'MXN':
          default: return '$';
        }
      };

      return (
        <div>
          <label className="text-[9px] font-bold text-slate-400 uppercase ml-1">{label}</label>
          <div className="relative">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm font-bold text-slate-500 dark:text-slate-400">
              {getCurrencySymbol(currency)}
            </span>
            <input
              type="text"
              inputMode="decimal"
              className="w-full p-3 pl-16 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 font-semibold"
              value={displayValue}
              onFocus={() => {
                setIsEditing(true);
                setDisplayValue((current) => current.replace(/,/g, ''));
              }}
              onChange={handleChange}
              onBlur={handleBlur}
              placeholder="0.00"
            />
          </div>
        </div>
      );
    }

    // --- ICONOS ---
    const IconCompass = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>;
    const IconList = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>;

    const IconPaperclip = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>;
    const IconFileText = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>;
    const IconPlus = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;

    // --- ICONOS DE VERIFICACIÓN ---
    const IconVerified = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconUnverified = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;

    // --- CARGADOR E INDICADORES ---
    const BoxLoader = ({ message = "Cargando datos..." }) => (
      <div className="flex flex-col items-center justify-center p-12 space-y-6">
        <div className="flex items-end justify-center space-x-2 h-10">
          {[0, 0.15, 0.3, 0.45].map((delay, i) => (
            <div key={i} className="w-3 bg-indigo-600 rounded-sm animate-box-bounce h-full" style={{ animationDelay: `${delay}s`, transformOrigin: 'bottom' }} />
          ))}
        </div>
        <p className="text-slate-500 dark:text-slate-400 font-medium animate-pulse text-sm">{message}</p>
      </div>
    );

    const Toast = ({ message, type, onClose }) => {
      if (!message) return null;
      useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, [message]);
      const color = type === 'error' ? 'bg-red-600' : 'bg-slate-800 dark:bg-slate-900';
      return (
        <div className={`fixed top-12 left-4 right-4 ${color} text-white p-4 rounded-xl shadow-lg z-50 flex justify-between items-center transition-all animate-fade-in`}>
          <span className="text-sm font-medium">{message}</span>
          <button onClick={onClose} className="text-xs font-bold opacity-70 hover:opacity-100">CERRAR</button>
        </div>
      );
    };

    const RECENT_OBRAS_KEY = "recentObras";
    const VIEWED_OBRAS_KEY = "obraViewedHistory"; 
    const UI_SETTINGS_KEY = "obraUiSettings";
    const MAX_RECENT = 3;
    const MEASURE_ROUND_FACTOR = 10000;
    
    const DEFAULT_UI_SETTINGS = { darkMode: false, rotateMeasures: true };
    const DEFAULT_OBRA = {
      id: '', nombre_obra: '', ubicacion: '', estatus: 'Disponible', tipo_obra: '', 
      superficie: '', precio_lista: '', precio_venta: '', fecha_registro: '', fecha_adquisicion: '', 
      cliente: '', observaciones: '', id_responsable: '', autor: '', 
      asignacion: '', provenance: '', clave: '', ancho: '', alto: '', largo: '', peso: '', tags: [], tipo_moneda: 'MXN',
      documentos: [], adjuntos: [], verificada: false
    };

    function getRecentIds() { try { return JSON.parse(localStorage.getItem(RECENT_OBRAS_KEY) || "[]"); } catch (e) { return []; } }
    function saveRecentId(id) {
      if (!id) return;
      const ids = getRecentIds().filter(x => x !== id);
      ids.unshift(id);
      localStorage.setItem(RECENT_OBRAS_KEY, JSON.stringify(ids.slice(0, MAX_RECENT)));
    }
    function getViewedHistory() { try { return JSON.parse(localStorage.getItem(VIEWED_OBRAS_KEY) || "[]"); } catch (e) { return []; } }
    function addViewedHistory(id) {
      if (!id) return;
      let ids = getViewedHistory().filter(x => x !== id);
      ids.unshift(id);
      ids = ids.slice(0, 100); 
      localStorage.setItem(VIEWED_OBRAS_KEY, JSON.stringify(ids));
      return ids;
    }
    function clearViewedHistory() { localStorage.removeItem(VIEWED_OBRAS_KEY); return []; }
    function getUiSettings() {
      try {
        const storedSettings = JSON.parse(localStorage.getItem(UI_SETTINGS_KEY) || "{}");
        const rotateMeasures = typeof storedSettings.rotateMeasures === 'boolean' ? storedSettings.rotateMeasures : !!storedSettings.invertMeasures;
        return { ...DEFAULT_UI_SETTINGS, ...storedSettings, rotateMeasures };
      } catch (e) { return { ...DEFAULT_UI_SETTINGS }; }
    }

    const getFirstImage = (obra) => {
        if (obra && obra.adjuntos && obra.adjuntos.length > 0) {
            const img = obra.adjuntos.find(a => a.mimeType?.includes('image') || a.name?.match(/\.(jpg|jpeg|png|gif|webp)$/i));
            if (img && img.id) return `https://drive.google.com/thumbnail?id=${img.id}&sz=w600`;
            if (img && img.url) return img.url;
        }
        return null;
    }

    // --- COMPONENTE PRINCIPAL ---
    function App() {
      const normalizeMeasureValue = (value) => {
        if (value === '' || value === null || value === undefined) return '';
        const n = parseFloat(value);
        return Number.isFinite(n) ? (Math.round(n * MEASURE_ROUND_FACTOR) / MEASURE_ROUND_FACTOR) : '';
      };

      const getDisplayedMeasures = (obra, rotate) => ({
        ancho: rotate ? obra?.alto : obra?.ancho,
        alto: rotate ? obra?.largo : obra?.alto,
        largo: rotate ? obra?.ancho : obra?.largo
      });

      const [view, setView] = useState("discover"); 
      const [loading, setLoading] = useState(true);
      const [obras, setObras] = useState([]);
      const [responsables, setResponsables] = useState([]);
      const [comisiones, setComisiones] = useState([]);
      const [search, setSearch] = useState("");
      
      const [filterStatus, setFilterStatus] = useState("");
      const [filterTipo, setFilterTipo] = useState("");
      const [filterProvenance, setFilterProvenance] = useState("");
      const [filterAutor, setFilterAutor] = useState("");
      const [filterPriceMin, setFilterPriceMin] = useState("");
      const [filterPriceMax, setFilterPriceMax] = useState("");
      const [showFilters, setShowFilters] = useState(false);
      
      const [currentObra, setCurrentObra] = useState(null);
      const [currentAuthor, setCurrentAuthor] = useState(null);
      
      const [pendingFiles, setPendingFiles] = useState([]);
      const [selectedTechAdj, setSelectedTechAdj] = useState('RW');
      const [newDoc, setNewDoc] = useState({ tipo: '', nombre: '', url: '', fecha: '' });
      const [uploadingAdj, setUploadingAdj] = useState(false);
      const [portadaPreviewUrl, setPortadaPreviewUrl] = useState('');
      
      const [toast, setToast] = useState({ message: '', type: '' });
      const [saving, setSaving] = useState(false);
      const [recentIds, setRecentIds] = useState(() => getRecentIds());
      const [viewedIds, setViewedIds] = useState(() => getViewedHistory()); 
      const [uiSettings, setUiSettings] = useState(() => getUiSettings());
      const [togglingVerification, setTogglingVerification] = useState(false);

      // --- Estado para el modal de Provenance ---
      const [showProvModal, setShowProvModal] = useState(false);
      const [newProvName, setNewProvName] = useState('');
      const [newProvPercentage, setNewProvPercentage] = useState('');
      const [savingProv, setSavingProv] = useState(false);
      const [provError, setProvError] = useState('');

      const imageInputRef = useRef(null);
      const techInputRef = useRef(null);

      // Obtener listas de sugerencias (solo nombres, no abreviaturas)
      const tecnicaSuggestions = useMemo(() => Object.keys(TECNICA_ABREVIATURAS).sort(), []);
      const autorSuggestions = useMemo(() => Object.keys(AUTOR_ABREVIATURAS).sort(), []);

      // Opciones de ubicación
      const ubicacionOptions = [
        'Bodega SP',
        'Bodega LF',
        'Provenance'
      ];

      useEffect(() => { fetchAllData(); }, []);

      useEffect(() => {
        localStorage.setItem(UI_SETTINGS_KEY, JSON.stringify(uiSettings));
        if (uiSettings.darkMode) { document.documentElement.classList.add('dark'); } 
        else { document.documentElement.classList.remove('dark'); }
      }, [uiSettings]);

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.substring(1);
          if (!hash && (view === 'detail' || view === 'author')) setView("list");
          else if (hash && obras.length > 0) {
            const linkedObra = obras.find(o => o.id === hash || o.clave === hash);
            if (linkedObra) {
              setCurrentObra(linkedObra);
              setView("detail");
              setViewedIds(addViewedHistory(linkedObra.id));
            }
          }
        };
        window.addEventListener("hashchange", handleHashChange);
        return () => window.removeEventListener("hashchange", handleHashChange);
      }, [obras, view]);

      const getImageOriginalAdjunto = () => {
        const existingAdjuntos = currentObra?.adjuntos || [];
        const pendingAdjuntos = pendingFiles || [];
        return (
          existingAdjuntos.find(adjunto => adjunto?.typeCode === 'RW') ||
          existingAdjuntos[0] ||
          pendingAdjuntos.find(file => file.typeCode === 'RW') ||
          pendingAdjuntos[0] ||
          null
        );
      };

      const isImageOriginalAdjunto = (adjunto) => getImageOriginalAdjunto() === adjunto;
      const getPrimaryPendingImageOriginal = () => {
        const primary = getImageOriginalAdjunto();
        if (!primary || !pendingFiles.includes(primary)) return null;
        return primary;
      };

      const getTechnicalPendingFiles = () => {
        const primary = getImageOriginalAdjunto();
        return pendingFiles.filter(file => file !== primary);
      };

      const getTechnicalStoredAdjuntos = () => {
        const primary = getImageOriginalAdjunto();
        return (currentObra?.adjuntos || []).filter(adjunto => adjunto !== primary);
      };

      const hasImageOriginalAdjunto = () => !!getImageOriginalAdjunto();

      useEffect(() => {
        let objectUrl = '';
        const imageOriginal = getImageOriginalAdjunto();
        const canPreview = Boolean(
          imageOriginal && (
            imageOriginal.typeCode === 'RW' ||
            imageOriginal.kind === 'imagen_original' ||
            imageOriginal.kind === 'image_original' ||
            imageOriginal.type?.includes('image') ||
            imageOriginal.mimeType?.includes('image') ||
            imageOriginal.name?.match(/\.(jpg|jpeg|png|gif|webp)$/i)
          )
        );

        if (imageOriginal && canPreview) {
          if (imageOriginal.id) {
            setPortadaPreviewUrl(`https://drive.google.com/thumbnail?id=${imageOriginal.id}&sz=w1200`);
            return;
          }

          if (imageOriginal.url) {
            setPortadaPreviewUrl(imageOriginal.url);
            return;
          }

          if (imageOriginal.type?.includes('image') || imageOriginal.name?.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
            objectUrl = URL.createObjectURL(imageOriginal);
            setPortadaPreviewUrl(objectUrl);
            return () => URL.revokeObjectURL(objectUrl);
          }
        }

        setPortadaPreviewUrl('');
      }, [currentObra?.adjuntos, pendingFiles]);

      const fetchAllData = async () => {
        setLoading(true);
        try {
          const res = await fetch(API_URL);
          if (!res.ok) throw new Error("Fallo en la red");
          const data = await res.json();
          if (data && data.registrosObra) {
            const fetchedObras = data.registrosObra.map(o => ({
              ...o,
              ancho: normalizeMeasureValue(o.ancho),
              alto: normalizeMeasureValue(o.alto),
              largo: normalizeMeasureValue(o.largo),
              tipo_moneda: o.tipo_moneda || 'MXN',
              documentos: Array.isArray(o.documentos) ? o.documentos : [],
              adjuntos: Array.isArray(o.adjuntos) ? o.adjuntos : [],
              verificada: o.verificada === true || o.verificada === 'Sí' || o.verificada === 'true'
            }));
            setObras(fetchedObras);
            setResponsables(data.responsables || []);
            setComisiones(data.comisiones || []);

            const hash = window.location.hash.substring(1);
            if (hash) {
              const linkedObra = fetchedObras.find(o => o.id === hash || o.clave === hash);
              if (linkedObra) openDetail(linkedObra, true);
            }
          } else {
            showToast("Error de formato API", "error");
          }
        } catch (e) { showToast("Error de conexión con el backend.", "error"); } 
        finally { setLoading(false); }
      };

      const showToast = (message, type = 'success') => setToast({ message, type });

      const openDetail = (obra, isInitialLoad = false) => {
        if (!obra) return;
        saveRecentId(obra.id);
        setRecentIds(getRecentIds());
        setViewedIds(addViewedHistory(obra.id));
        setCurrentObra(obra);
        setView("detail");
        if (!isInitialLoad) window.location.hash = obra.id;
      };

      const handleCreateNewObra = () => {
        const today = new Date().toISOString().split('T')[0];
        const newObra = {
          ...DEFAULT_OBRA,
          id: 'obra_' + (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2))),
          fecha_registro: today,
          verificada: false
        };
        newObra.clave = generateClave('', '', '', '', obras);
        setCurrentObra(newObra);
        setPendingFiles([]);
        setSelectedTechAdj('RW');
        setView("form");
        window.history.pushState("", document.title, window.location.pathname + window.location.search);
      };

      const handleEditObra = (obra) => {
        const today = new Date().toISOString().split('T')[0];
        setCurrentObra({
          ...obra,
          tags: Array.isArray(obra.tags) ? obra.tags.join(', ') : (obra.tags || ''),
          fecha_adquisicion: today,
          verificada: obra.verificada === true || obra.verificada === 'Sí' || obra.verificada === 'true'
        });
        setPendingFiles([]);
        setSelectedTechAdj('RW');
        setView("form");
      };

      const handleFormChange = (field, value) => {
        if (!currentObra) return;
        const updated = { ...currentObra, [field]: value };
        
        if (field === 'provenance' || field === 'autor' || field === 'tipo_obra') {
          let provName = '';
          const provVal = updated.provenance;
          if (provVal) {
            const com = comisiones.find(c => c.id === provVal);
            provName = com ? com.provenance : provVal;
          }
          updated.clave = generateClave(provName, updated.autor, updated.tipo_obra, updated.clave, obras);
        }
        
        setCurrentObra(updated);
      };

      // --- Función para añadir una nueva comisión (Provenance) ---
      const handleAddProvenance = async () => {
        setProvError('');
        
        // Validaciones
        const name = newProvName.trim();
        if (!name) {
          setProvError('El nombre de Provenance es obligatorio');
          return;
        }
        const percentage = parseFloat(newProvPercentage);
        if (isNaN(percentage) || percentage < 0 || percentage > 100) {
          setProvError('El porcentaje debe ser un número entre 0 y 100');
          return;
        }

        setSavingProv(true);
        try {
          const payload = {
            id: 'com_' + (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2))),
            provenance: name,
            porcentaje: percentage
          };

          const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'comision_add', data: payload })
          });
          const result = await res.json();

          if (result.result === 'success') {
            // Actualizar la lista de comisiones localmente
            const newComision = { id: payload.id, provenance: name, porcentaje: percentage };
            setComisiones(prev => [...prev, newComision]);
            
            // Seleccionar automáticamente la nueva comisión en el campo
            handleFormChange('provenance', payload.id);
            
            // Cerrar modal y limpiar
            setShowProvModal(false);
            setNewProvName('');
            setNewProvPercentage('');
            showToast(`✅ Provenance "${name}" creado con ${percentage}%`);
          } else {
            setProvError(result.message || 'Error al crear Provenance');
          }
        } catch (error) {
          console.error('Error al crear Provenance:', error);
          setProvError('Error de conexión con el servidor');
        } finally {
          setSavingProv(false);
        }
      };

      const formatCurrency = (v, currencyCode = 'MXN') => {
        const val = parseFloat(v);
        if (!Number.isFinite(val)) return '-';
        try { 
          const formatted = new Intl.NumberFormat('es-MX', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }).format(val);
          
          switch(currencyCode) {
            case 'USD':
              return `USD $${formatted}`;
            case 'EUR':
              return `€${formatted}`;
            case 'MXN':
            default:
              return `$${formatted}`;
          }
        } 
        catch(e) { return `$${val.toLocaleString('es-MX')} ${currencyCode}`; }
      };

      const getActorId = () => {
        try {
          const u = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
          if (u && u.id) return u.id;
        } catch (_) {}
        return currentObra?.id_responsable || (responsables[0]?.id || '');
      };

      const handleToggleVerification = async () => {
        if (!currentObra) return;
        const actorId = getActorId();
        if (!actorId) {
          showToast('Selecciona un responsable primero', 'error');
          return;
        }
        
        const newVerificationState = !currentObra.verificada;
        setTogglingVerification(true);
        
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
              action: 'registro_obra_verificar',
              data: {
                id_obra: currentObra.id,
                id_actor: actorId,
                verificada: newVerificationState
              }
            })
          });
          const result = await res.json();
          
          if (result.result === 'success') {
            setCurrentObra({ ...currentObra, verificada: newVerificationState });
            setObras(obras.map(o => 
              o.id === currentObra.id ? { ...o, verificada: newVerificationState } : o
            ));
            showToast(newVerificationState ? '✅ Obra verificada' : '🔓 Verificación removida');
          } else {
            showToast('Error: ' + (result.message || 'No se pudo actualizar'), 'error');
          }
        } catch (e) {
          showToast("Error al cambiar verificación", "error");
        } finally {
          setTogglingVerification(false);
        }
      };

      const generateAdjuntoName = (tipoCode, originalName) => {
        const claveBase = currentObra?.clave || 'OBRA';
        const extMatch = originalName.match(/\.[^/.]+$/);
        const ext = extMatch ? extMatch[0].toLowerCase() : '';

        const existingAdjCount = (currentObra?.adjuntos || []).filter(a => {
          const nameWithoutExt = (a.name || '').replace(/\.[^/.]+$/, '');
          return nameWithoutExt.includes(`-${tipoCode}`);
        }).length;

        const pendingCount = pendingFiles.filter(p => p.typeCode === tipoCode).length;

        const nextNum = existingAdjCount + pendingCount + 1;
        const seqStr = String(nextNum).padStart(2, '0');

        return `${claveBase}-${tipoCode}${seqStr}${ext}`;
      };

      const uploadAdjuntoFile = async (file, tipoCode) => {
        if (!file) return;

        const customName = generateAdjuntoName(tipoCode, file.name);
        const isExisting = obras.some(o => o.id === currentObra.id);

        if (!isExisting) {
          file.customName = customName;
          file.typeCode = tipoCode;
          setPendingFiles(prev => [...prev, file]);
          showToast(`Guardado en cola como: ${customName}`);
          return;
        }

        const actorId = getActorId();
        setUploadingAdj(true);
        showToast("Subiendo archivo a Drive...");
        try {
          const base64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = ev => resolve(ev.target.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });

          const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
              action: 'registro_obra_upload_adjunto',
              data: {
                id_obra: currentObra.id,
                id_actor: actorId,
                filename: customName,
                mimeType: file.type || 'application/octet-stream',
                base64
              }
            })
          });
          const result = await res.json();
          if (result.result === 'success') {
            const newAdj = {
              id: result.fileId,
              name: customName,
              url: result.url,
              kind: 'adjunto_obra',
              typeCode: tipoCode,
              uploadedBy: actorId,
              createdAt: new Date().toISOString(),
              mimeType: file.type || 'application/octet-stream'
            };
            const updatedAdj = [...(currentObra.adjuntos || []), newAdj];
            setCurrentObra({ ...currentObra, adjuntos: updatedAdj });
            showToast("Subido a Drive con éxito");
          } else {
            showToast("Error subiendo archivo", "error");
          }
        } catch (e) {
          showToast("Error al subir archivo", "error");
        } finally {
          setUploadingAdj(false);
        }
      };

      const handleUploadImagenOriginal = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        if (hasImageOriginalAdjunto()) {
          showToast('La Imagen Original ya está cargada', 'error');
          e.target.value = '';
          return;
        }

        await uploadAdjuntoFile(file, 'RW');
        e.target.value = '';
      };

      const handleUploadTecnicos = async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        if (!hasImageOriginalAdjunto()) {
          showToast('La caja se desbloqueará después de subir la Imagen Original', 'error');
          e.target.value = '';
          return;
        }

        for (const file of files) {
          await uploadAdjuntoFile(file, selectedTechAdj || TECH_ADJUNTO_CODE);
        }
        e.target.value = '';
      };

      const handleDeleteAdjunto = async (fileId) => {
        if (!confirm('¿Eliminar este adjunto? Se borrará también de Drive.')) return;
        const actorId = getActorId();
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
              action: 'registro_obra_adjunto_eliminar',
              data: {
                id_obra: currentObra.id,
                id_actor: actorId,
                fileId
              }
            })
          });
          const result = await res.json();
          if (result.result === 'success') {
            const updatedAdj = currentObra.adjuntos.filter(a => a.id !== fileId);
            setCurrentObra({ ...currentObra, adjuntos: updatedAdj });
            showToast("Adjunto eliminado");
          } else { showToast('Error al eliminar adjunto', 'error'); }
        } catch (e) { showToast("Error en la llamada", "error"); }
      };

      const handleSave = async (e) => {
        e.preventDefault();
        if (!currentObra) return;
        const hasAttachments = (currentObra.adjuntos && currentObra.adjuntos.length > 0) || pendingFiles.length > 0;
        if (!hasAttachments) {
          showToast('Debes subir al menos un adjunto antes de guardar la obra', 'error');
          return;
        }
        setSaving(true);
        const isExisting = obras.some(o => o.id === currentObra.id);
        const action = isExisting ? 'registro_obra_update' : 'registro_obra_add';
        
        const tagsNormalized = Array.isArray(currentObra.tags) 
          ? currentObra.tags 
          : (currentObra.tags || '').toString().split(',').map(t => t.trim()).filter(Boolean);

        const payload = { 
          ...currentObra, 
          ancho: normalizeMeasureValue(currentObra.ancho), 
          alto: normalizeMeasureValue(currentObra.alto), 
          largo: normalizeMeasureValue(currentObra.largo), 
          superficie: parseFloat(currentObra.superficie) || 0,
          precio_lista: parseFloat(currentObra.precio_lista) || 0,
          precio_venta: parseFloat(currentObra.precio_venta) || 0,
          tags: tagsNormalized,
          verificada: currentObra.verificada === true || currentObra.verificada === 'Sí' || currentObra.verificada === 'true'
        };

        try {
          const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, data: payload }) });
          const result = await res.json();
          
          if (result && result.result === 'success') {
            if (!isExisting && pendingFiles.length > 0) {
              const actorId = getActorId() || payload.id_responsable;
              showToast("Subiendo adjuntos pendientes...");
              for (const file of pendingFiles) {
                try {
                  const base64 = await new Promise((res, rej) => {
                    const r = new FileReader(); r.onload = ev => res(ev.target.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(file);
                  });
                  await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                      action: 'registro_obra_upload_adjunto',
                      data: { 
                        id_obra: payload.id, 
                        id_actor: actorId, 
                        filename: file.customName || file.name, 
                        mimeType: file.type || 'application/octet-stream', 
                        base64 
                      }
                    })
                  });
                } catch (_) {}
              }
            }

            showToast("Obra guardada correctamente");
            await fetchAllData();
            setView("list");
          } else { showToast("Error: " + (result?.message || 'Desconocido'), "error"); }
        } catch (e) { showToast("Error al guardar la obra", "error"); } 
        finally { setSaving(false); }
      };

      const handleDeleteObra = async () => {
        if (!confirm('¿Estás seguro de eliminar este registro de obra?')) return;
        setSaving(true);
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'registro_obra_delete', data: { id: currentObra.id } })
          });
          showToast("Registro eliminado");
          await fetchAllData();
          setView("list");
        } catch (e) { showToast("Error al eliminar", "error"); }
        finally { setSaving(false); }
      };

      const handleCopyInfo = () => {
        if (!currentObra) return;
        const prov = comisiones.find(c => c.id === currentObra.provenance)?.provenance || currentObra.provenance || "No definida";
        const resp = responsables.find(r => r.id === currentObra.id_responsable)?.nombre || currentObra.id_responsable || "Sin asignar";
        const verificadaStr = currentObra.verificada ? '✅ Verificada' : '❌ No verificada';
        const textToCopy = `Ficha de Obra: ${currentObra.nombre_obra || 'N/A'}\nWORK ID: ${currentObra.clave || 'N/A'}\nEstatus: ${currentObra.estatus || 'N/A'}\nTipo: ${currentObra.tipo_obra || 'N/A'}\nAutor: ${currentObra.autor || 'N/A'}\nUbicación: ${currentObra.ubicacion || 'N/A'}\nPrecio Lista: ${formatCurrency(currentObra.precio_lista, currentObra.tipo_moneda)}\nPrecio Venta: ${formatCurrency(currentObra.precio_venta, currentObra.tipo_moneda)}\nPeso: ${currentObra.superficie || 0}\nCliente: ${currentObra.cliente || 'N/A'}\nResponsable: ${resp}\nProvenance: ${prov}\nVerificada: ${verificadaStr}\nObservaciones: ${currentObra.observaciones || 'Ninguna'}\nEnlace: ${window.location.origin}${window.location.pathname}#${currentObra.id}`.trim();
        const textArea = document.createElement("textarea");
        textArea.value = textToCopy; document.body.appendChild(textArea); textArea.select();
        try { document.execCommand('copy'); showToast("Copiado al portapapeles"); } 
        catch (err) { showToast("Error al copiar", "error"); }
        document.body.removeChild(textArea);
      };

      const handleShare = async () => {
        const obraUrl = `${window.location.origin}${window.location.pathname}#${currentObra.id}`;
        if (navigator.share) {
          try {
            await navigator.share({
              title: currentObra.nombre_obra,
              text: `Mira esta obra de ${currentObra.autor || 'autor desconocido'}: ${currentObra.nombre_obra}`,
              url: obraUrl,
            });
          } catch (err) {}
        } else {
          handleCopyInfo();
        }
      };

      const handleReportError = async () => {
        if (!currentObra) return;
        const obraUrl = `${window.location.origin}${window.location.pathname}#${currentObra.id}`;
        const msg = `Hola, quiero reportar un error en la obra: ${currentObra.nombre_obra} - ${obraUrl}`;
        const url = `https://bot-yy1q.onrender.com/send?number=5212202334062&message=${encodeURIComponent(msg)}`;
        
        showToast("Enviando reporte...");
        try {
          await fetch(url, { mode: 'no-cors' });
          showToast("Reporte enviado al Bot de WhatsApp exitosamente");
        } catch (e) {
          showToast("No se pudo contactar con el Bot", "error");
        }
      };

      const tagsAsText = (tags) => Array.isArray(tags) ? tags.join(', ') : (tags || '');
      const uniqueValues = (items) => [...new Set(items.filter(Boolean).map(x => x.toString().trim()))].sort((a, b) => a.localeCompare(b, 'es-MX'));
      const parseNumeric = (value) => { const p = parseFloat(value); return Number.isFinite(p) ? p : null; };
      const matchesPriceRange = (p, min, max) => { if(min===null&&max===null) return true; if(p===null) return false; if(min!==null&&p<min) return false; if(max!==null&&p>max) return false; return true; };

      const minPriceValue = parseNumeric(filterPriceMin);
      const maxPriceValue = parseNumeric(filterPriceMax);
      const statusOptions = useMemo(() => uniqueValues(obras.map(o => o.estatus)), [obras]);
      const tipoOptions = useMemo(() => uniqueValues(obras.map(o => o.tipo_obra)), [obras]);
      const provenanceOptions = useMemo(() => uniqueValues(obras.map(o => comisiones.find(c => c.id === o.provenance)?.provenance || o.provenance)), [obras, comisiones]);
      const autorOptions = useMemo(() => uniqueValues(obras.map(o => o.autor)), [obras]);

      const filtered = [...obras].reverse().filter(o => {
        const selectedPrice = parseNumeric(o.precio_venta) ?? parseNumeric(o.precio_lista);
        return (
          ((o.nombre_obra || "").toLowerCase().includes(search.toLowerCase()) || (o.clave || "").toLowerCase().includes(search.toLowerCase())) &&
          (!filterStatus || (o.estatus || '') === filterStatus) &&
          (!filterTipo || (o.tipo_obra || '') === filterTipo) &&
          (!filterProvenance || (comisiones.find(c => c.id === o.provenance)?.provenance || o.provenance || '') === filterProvenance) &&
          (!filterAutor || (o.autor || '') === filterAutor) && matchesPriceRange(selectedPrice, minPriceValue, maxPriceValue)
        );
      });

      const categoriesDiscover = useMemo(() => {
        const grouped = {};
        obras.forEach(o => {
          const cat = o.tipo_obra || 'Otras Categorías';
          if (!grouped[cat]) grouped[cat] = [];
          grouped[cat].push(o);
        });
        return grouped;
      }, [obras]);

      const DiscoverCard = ({ obra }) => {
        const imgUrl = getFirstImage(obra);
        return (
          <div onClick={() => openDetail(obra)} className="relative w-64 h-80 rounded-[2rem] overflow-hidden shrink-0 snap-center shadow-md hover:shadow-xl transition-all cursor-pointer bg-slate-200 dark:bg-slate-800 group border border-slate-200/50 dark:border-slate-700/50">
            {imgUrl ? (
               <img src={imgUrl} className="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt={obra.nombre_obra} />
            ) : (
               <div className="absolute inset-0 bg-gradient-to-br from-indigo-500 to-purple-700" />
            )}
            <div className="absolute inset-0 bg-gradient-to-t from-slate-900/95 via-slate-900/30 to-transparent" />
            <div className="absolute bottom-0 left-0 right-0 p-6 flex flex-col justify-end">
               <span className="text-[10px] font-black tracking-widest text-indigo-300 uppercase mb-1 drop-shadow-md">{obra.estatus}</span>
               <h3 className="text-white font-extrabold text-xl leading-tight mb-2 truncate drop-shadow-md">{obra.nombre_obra || 'Sin nombre'}</h3>
               <div className="flex justify-between items-center">
                 <p className="text-slate-200 text-sm font-semibold">{formatCurrency(obra.precio_venta || obra.precio_lista, obra.tipo_moneda)}</p>
                 <span className="text-slate-400 text-xs font-mono">#{obra.clave || '-'}</span>
               </div>
            </div>
          </div>
        );
      };

      const isMainTab = ['discover', 'list', 'settings'].includes(view);

      return (
        <div className="min-h-screen pb-24 pt-safe">
          
          {/* MODAL PARA AÑADIR PROVENANCE */}
          <div className={`prov-modal-overlay ${showProvModal ? '' : 'hidden'}`}>
            <div className="prov-modal" onClick={(e) => e.stopPropagation()}>
              <h3>Añadir Provenance</h3>
              <p className="subtitle">Registra una nueva fuente de origen para la obra.</p>
              
              <div className="space-y-4">
                <div>
                  <label>Nombre del Provenance</label>
                  <input 
                    type="text" 
                    placeholder="Ej: Galería Norte" 
                    value={newProvName}
                    onChange={(e) => {
                      setNewProvName(e.target.value);
                      setProvError('');
                    }}
                    autoFocus
                  />
                </div>
                <div>
                  <label>Porcentaje de Comisión (%)</label>
                  <input 
                    type="number" 
                    min="0" 
                    max="100" 
                    step="0.01"
                    placeholder="0.00"
                    value={newProvPercentage}
                    onChange={(e) => {
                      setNewProvPercentage(e.target.value);
                      setProvError('');
                    }}
                  />
                </div>
                <div className={`error-msg ${provError ? 'visible' : ''}`}>{provError}</div>
              </div>
              
              <div className="btn-row">
                <button 
                  type="button" 
                  className="btn-cancel"
                  onClick={() => {
                    setShowProvModal(false);
                    setNewProvName('');
                    setNewProvPercentage('');
                    setProvError('');
                  }}
                >
                  Cancelar
                </button>
                <button 
                  type="button" 
                  className="btn-save"
                  onClick={handleAddProvenance}
                  disabled={savingProv}
                >
                  {savingProv ? 'Guardando...' : 'Guardar Provenance'}
                </button>
              </div>
            </div>
          </div>

          {/* VISTA: DISCOVER */}
          {view === "discover" && (
            <div className="animate-fade-in">
              <header className="px-6 pt-8 pb-4">
                <h1 className="text-3xl font-black tracking-tight text-slate-900 dark:text-white">Descubrir</h1>
                <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">Explora tu colección por categorías</p>
              </header>
              {loading ? <BoxLoader message="Cargando obras..." /> : (
                <div className="space-y-8">
                  {Object.entries(categoriesDiscover).sort(([a], [b]) => a.localeCompare(b)).map(([cat, items]) => (
                    <section key={cat}>
                      <div className="flex justify-between items-center px-6 mb-4">
                        <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100">{cat} <span className="text-slate-400 font-normal text-sm ml-1">({items.length})</span></h2>
                      </div>
                      <div className="flex overflow-x-auto gap-4 px-6 pb-4 snap-x hide-scrollbar">
                        {items.map(o => <DiscoverCard key={o.id} obra={o} />)}
                      </div>
                    </section>
                  ))}
                  {Object.keys(categoriesDiscover).length === 0 && (
                    <p className="text-center text-slate-500 mt-10">No hay obras registradas aún.</p>
                  )}
                </div>
              )}
            </div>
          )}

          {/* VISTA: LISTA */}
          {view === "list" && (
            <div className="animate-fade-in max-w-xl mx-auto">
              <header className="sticky top-0 z-10 glass-header p-4 border-b bg-white/90 dark:bg-slate-900/90 border-slate-200 dark:border-slate-800 shadow-sm">
                <h1 className="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-4">Inventario de Obras</h1>
                <div className="relative">
                  <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><IconSearch /></span>
                  <input type="text" placeholder="Buscar nombre o clave..." className="w-full pl-10 pr-4 py-3 bg-slate-100 dark:bg-slate-800 border-none rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-slate-100 placeholder-slate-500" value={search} onChange={e => setSearch(e.target.value)} />
                </div>
                <button onClick={() => setShowFilters(!showFilters)} className="mt-3 w-full px-3 py-2 text-xs font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 rounded-xl transition-all">
                  {showFilters ? "Ocultar filtros" : "Filtros avanzados"}
                </button>
                {showFilters && (
                  <div className="grid grid-cols-2 gap-2 mt-3 p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-700/50">
                    <select className="w-full p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs outline-none text-slate-900 dark:text-slate-100" value={filterStatus} onChange={e => setFilterStatus(e.target.value)}><option value="">Estatus: Todos</option>{statusOptions.map(v => <option key={v} value={v}>{v}</option>)}</select>
                    <select className="w-full p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs outline-none text-slate-900 dark:text-slate-100" value={filterTipo} onChange={e => setFilterTipo(e.target.value)}><option value="">Tipo: Todos</option>{tipoOptions.map(v => <option key={v} value={v}>{v}</option>)}</select>
                    <select className="w-full p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs outline-none text-slate-900 dark:text-slate-100" value={filterProvenance} onChange={e => setFilterProvenance(e.target.value)}><option value="">Provenance: Todas</option>{provenanceOptions.map(v => <option key={v} value={v}>{v}</option>)}</select>
                    <select className="w-full p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs outline-none text-slate-900 dark:text-slate-100" value={filterAutor} onChange={e => setFilterAutor(e.target.value)}><option value="">Autor: Todos</option>{autorOptions.map(v => <option key={v} value={v}>{v}</option>)}</select>
                    <input type="number" placeholder="Min $" className="w-full p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs outline-none" value={filterPriceMin} onChange={e => setFilterPriceMin(e.target.value)}/>
                    <input type="number" placeholder="Max $" className="w-full p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs outline-none" value={filterPriceMax} onChange={e => setFilterPriceMax(e.target.value)}/>
                  </div>
                )}
              </header>
              <main className="p-4 space-y-3">
                {loading ? <BoxLoader message="Cargando inventario..." /> : filtered.map(o => {
                  const isNew = !viewedIds.includes(o.id);
                  return (
                    <div key={o.id} onClick={() => openDetail(o)} className="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 active:scale-95 cursor-pointer transition-transform">
                      <div className="flex justify-between items-start gap-3 mb-2">
                        <div className="flex flex-col gap-1 min-w-0">
                          <h3 className="font-bold text-slate-800 dark:text-slate-100 truncate">{o.nombre_obra}</h3>
                          {isNew && <span className="inline-flex w-fit items-center gap-1 bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded text-[9px] font-black uppercase"><IconUnseen /> Nueva</span>}
                        </div>
                        <span className="text-[10px] font-bold bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 px-2 py-1 rounded uppercase shrink-0">{o.estatus}</span>
                      </div>
                      <div className="flex items-center justify-between text-xs mt-3 pt-3 border-t border-slate-100 dark:border-slate-800/60">
                        <p className="text-slate-500 dark:text-slate-400 font-mono font-medium">#{o.clave || '-'}</p>
                        <p className="font-semibold text-slate-700 dark:text-slate-300">{formatCurrency(o.precio_venta || o.precio_lista, o.tipo_moneda)}</p>
                      </div>
                    </div>
                  )
                })}
              </main>
            </div>
          )}

          {/* VISTA: AJUSTES */}
          {view === "settings" && (

                      <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Estatus *</label>
                      <select className="w-full p-4 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none" value={currentObra.estatus || 'Disponible'} onChange={e => handleFormChange('estatus', e.target.value)}>
                        <option value="Disponible">Disponible</option>
                        <option value="Vendida">Vendida</option>
                        <option value="En Restauración">En Restauración</option>
                        <option value="Apartada">Apartada</option>
                        <option value="En mora">En mora</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Ubicación</label>
                      <select className="w-full p-4 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none" value={currentObra.ubicacion || ''} onChange={e => handleFormChange('ubicacion', e.target.value)}>
                        <option value="">Seleccionar ubicación</option>
                        {ubicacionOptions.map(opt => (
                          <option key={opt} value={opt}>{opt}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Responsable</label>
                      <select className="w-full p-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl outline-none text-xs" value={currentObra.id_responsable || ''} onChange={e => handleFormChange('id_responsable', e.target.value)}>
                        <option value="">Sin Responsable</option>
                        {responsables.map(r => (
                          <option key={r.id} value={r.id}>{r.nombre}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">WORK ID (Autogenerado)</label>
                      <input readOnly type="text" className="w-full p-4 bg-slate-100 dark:bg-slate-800 border-none rounded-2xl outline-none text-indigo-600 dark:text-indigo-400 font-mono font-bold" value={currentObra.clave || ''} />
                    </div>
                  </div>
                </section>

                <section className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm space-y-4">
                  <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest">Metadata</h3>
                  <div className="space-y-4">
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Tags</label>
                      <input type="text" placeholder="abstracto, oleo, gran_formato" className="w-full p-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl outline-none" value={currentObra.tags || ''} onChange={e => handleFormChange('tags', e.target.value)} />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Observaciones</label>
                      <textarea rows="3" className="w-full p-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl outline-none" value={currentObra.observaciones || ''} onChange={e => handleFormChange('observaciones', e.target.value)} />
                    </div>
                    <div className="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700/50">
                      <div className="flex items-center gap-3">
                        {currentObra.verificada ? (
                          <IconVerified className="w-5 h-5 text-emerald-500" />
                        ) : (
                          <IconUnverified className="w-5 h-5 text-amber-500" />
                        )}
                        <div>
                          <p className="text-sm font-semibold text-slate-700 dark:text-slate-300">
                            {currentObra.verificada ? '✅ Verificada' : '⏳ Pendiente de verificación'}
                          </p>
                          <p className="text-[10px] text-slate-400">
                            {currentObra.verificada 
                              ? 'Esta obra ha sido verificada' 
                              : 'Marcar como verificada al guardar'}
                          </p>
                        </div>
                      </div>
                      <label className="relative inline-flex items-center cursor-pointer">
                        <input 
                          type="checkbox" 
                          className="sr-only peer" 
                          checked={currentObra.verificada === true}
                          onChange={(e) => handleFormChange('verificada', e.target.checked)}
                        />
                        <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-indigo-300 dark:peer-focus:ring-indigo-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-emerald-500"></div>
                      </label>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2" />
                  </div>
                </section>

                <section className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/60 dark:border-slate-800 shadow-sm space-y-4">
                  <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest">Documentación</h3>
                  <div className="grid gap-4 lg:grid-cols-2">
                    <div className="bg-slate-50 dark:bg-slate-800/50 rounded-2xl p-4 border border-slate-100 dark:border-slate-800 space-y-4">
                      <div className="flex items-start justify-between gap-3">
                        <div>
                          <p className="text-xs font-bold text-slate-500 uppercase">Imagen Original</p>
                          <p className="text-[10px] text-slate-500 mt-1">Solo acepta un archivo y se bloquea después de subirlo.</p>
                        </div>
                        <IconPaperclip className="w-5 h-5 text-slate-400 shrink-0" />
                      </div>

                      {getImageOriginalAdjunto() && (
                        <div className="space-y-2">
                          {(() => {
                            const primaryAdjunto = getImageOriginalAdjunto();
                            if (!primaryAdjunto) return null;
                            return (
                              <div className="flex justify-between items-center p-3 bg-white dark:bg-slate-800 rounded-xl text-xs border border-slate-100 dark:border-slate-700">
                                <span className="truncate font-mono font-medium min-w-0 pr-2">{primaryAdjunto.name || primaryAdjunto.id}</span>
                                <span className="text-[10px] font-bold text-emerald-600 uppercase">Bloqueada</span>
                              </div>
                            );
                          })()}
                        </div>
                      )}

                      {getPrimaryPendingImageOriginal() && (
                        <div className="space-y-2">
                          <div className="flex justify-between items-center p-3 bg-white dark:bg-slate-800 rounded-xl text-xs border border-slate-100 dark:border-slate-700">
                            <span className="truncate font-mono font-medium min-w-0 pr-2">{getPrimaryPendingImageOriginal().customName || getPrimaryPendingImageOriginal().name}</span>
                            <button type="button" onClick={() => setPendingFiles(pendingFiles.filter(file => file !== getPrimaryPendingImageOriginal()))} className="text-red-500 hover:text-red-700 p-1 shrink-0"><IconTrash /></button>
                          </div>
                        </div>
                      )}

                      {!hasImageOriginalAdjunto() && (
                        <>
                          <input ref={imageInputRef} type="file" accept="image/*" className="hidden" onChange={handleUploadImagenOriginal} />
                          <button 
                            type="button" 
                            disabled={uploadingAdj} 
                            onClick={() => imageInputRef.current?.click()} 
                            className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white border border-indigo-600 rounded-xl text-xs font-bold transition-all shadow-md active:scale-95 flex justify-center items-center gap-2 disabled:opacity-50"
                          >
                            {uploadingAdj ? 'Subiendo...' : '⬆ Subir Imagen Original'}
                          </button>
                        </>
                      )}

                      <div className="rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 aspect-[4/3] relative">
                        {portadaPreviewUrl ? (
                          <img src={portadaPreviewUrl} alt="Portada de la obra" className="absolute inset-0 w-full h-full object-cover" />
                        ) : (
                          <div className="absolute inset-0 flex flex-col items-center justify-center text-center p-4">
                            <IconFileText className="w-10 h-10 text-slate-400 mb-2" />
                            <p className="text-sm font-semibold text-slate-600 dark:text-slate-300">Portada debajo de Imagen Original</p>
                            <p className="text-xs text-slate-500 mt-1">Se mostrará aquí cuando subas la primera imagen.</p>
                          </div>
                        )}
                      </div>

                      <p className="text-[10px] text-slate-500">La portada se toma automáticamente de la Imagen Original.</p>
                    </div>

                    <div className="bg-slate-50 dark:bg-slate-800/50 rounded-2xl p-4 border border-slate-100 dark:border-slate-800 space-y-4">
                      <div className="flex items-start justify-between gap-3">
                        <div>
                          <p className="text-xs font-bold text-slate-500 uppercase">Documentos técnicos</p>
                          <p className="text-[10px] text-slate-500 mt-1">
                            {hasImageOriginalAdjunto()
                              ? 'Ya puedes subir los adjuntos posteriores al primero.'
                              : 'Se desbloqueará después de subir la Imagen Original.'}
                          </p>
                        </div>
                        <IconFileText className="w-5 h-5 text-slate-400 shrink-0" />
                      </div>

                      <div>
                        <label className="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1 block">Nomenclatura</label>
                        <select
                          className="w-full p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none text-xs font-semibold"
                          value={selectedTechAdj}
                          onChange={e => setSelectedTechAdj(e.target.value)}
                          disabled={!hasImageOriginalAdjunto()}
                        >
                          <option value="RW">Imagen original RW</option>
                          <option value="RD">Imagen Editada RD</option>
                          <option value="FO">Foto de obra FO</option>
                          <option value="VD">video VD</option>
                          <option value="CER">Certificado CER</option>
                          <option value="COT">Cotización COT</option>
                        </select>
                      </div>

                      {getTechnicalPendingFiles().length > 0 && (
                        <div className="space-y-2">
                          {getTechnicalPendingFiles().map((f, i) => (
                            <div key={i} className="flex justify-between items-center p-3 bg-white dark:bg-slate-800 rounded-xl text-xs border border-slate-100 dark:border-slate-700">
                              <span className="truncate font-mono font-medium min-w-0 pr-2">{f.customName || f.name}</span>
                              <button type="button" onClick={() => setPendingFiles(pendingFiles.filter(file => file !== f))} className="text-red-500 hover:text-red-700 p-1 shrink-0"><IconTrash /></button>
                            </div>
                          ))}
                        </div>
                      )}

                      {getTechnicalStoredAdjuntos().length > 0 && (
                        <div className="space-y-2">
                          {getTechnicalStoredAdjuntos().map(adj => (
                            <div key={adj.id} className="flex justify-between items-center p-3 bg-white dark:bg-slate-800 rounded-xl text-xs border border-slate-100 dark:border-slate-700">
                              <span className="truncate font-mono font-medium min-w-0 pr-2">{adj.name || adj.id}</span>
                              <button type="button" onClick={() => handleDeleteAdjunto(adj.id)} className="text-red-500 hover:text-red-700 p-1 shrink-0"><IconTrash /></button>
                            </div>
                          ))}
                        </div>
                      )}

                      <input ref={techInputRef} type="file" multiple className="hidden" onChange={handleUploadTecnicos} />
                      <button 
                        type="button" 
                        disabled={!hasImageOriginalAdjunto() || uploadingAdj} 
                        onClick={() => techInputRef.current?.click()} 
                        className={`w-full py-3 border rounded-xl text-xs font-bold transition-all shadow-md active:scale-95 flex justify-center items-center gap-2 ${hasImageOriginalAdjunto() && !uploadingAdj ? 'bg-indigo-600 hover:bg-indigo-700 text-white border-indigo-600' : 'bg-slate-200 dark:bg-slate-700 text-slate-400 border-slate-300 dark:border-slate-600 cursor-not-allowed'}`}
                      >
                        {uploadingAdj ? 'Subiendo...' : '⬆ Subir Documentos técnicos'}
                      </button>
                      {!hasImageOriginalAdjunto() && (
                        <p className="text-[10px] text-amber-600 font-semibold uppercase tracking-widest">Se desbloqueará después de subir la Imagen Original</p>
                      )}
                    </div>
                  </div>
                </section>
                
                <button disabled={saving} type="submit" className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold shadow-lg flex justify-center items-center gap-2 active:scale-95 transition-all disabled:opacity-50">
                  {saving ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin" /> : <><IconSave /> Guardar Registro</>}
                </button>

                {obras.some(o => o.id === currentObra.id) && (
                  <button type="button" onClick={handleDeleteObra} className="w-full py-3 text-red-500 font-bold text-xs hover:underline text-center">
                    Eliminar Registro de Obra
                  </button>
                )}
              </form>
            </div>
          )}

          {/* NAVEGACIÓN INFERIOR PWA */}
          {isMainTab && (
            <div className="fixed bottom-0 left-0 right-0 z-50 glass-nav border-t border-slate-200/50 dark:border-slate-800/50 pb-safe-nav bg-white/80 dark:bg-slate-900/80">
              <div className="flex justify-around items-center h-16 max-w-md mx-auto px-2">
                <button onClick={() => setView('discover')} className={`flex flex-col items-center justify-center w-full h-full gap-1 transition-colors ${view === 'discover' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>
                  <IconCompass className="w-6 h-6" />
                  <span className="text-[10px] font-semibold">Descubrir</span>
                </button>
                <button onClick={() => setView('list')} className={`flex flex-col items-center justify-center w-full h-full gap-1 transition-colors ${view === 'list' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>
                  <IconList className="w-6 h-6" />
                  <span className="text-[10px] font-semibold">Obras</span>
                </button>
                <button onClick={handleCreateNewObra} className="flex flex-col items-center justify-center w-full h-full gap-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
                  <IconPlusCircle className="w-6 h-6" />
                  <span className="text-[10px] font-semibold">Crear</span>
                </button>
                <button onClick={() => setView('settings')} className={`flex flex-col items-center justify-center w-full h-full gap-1 transition-colors ${view === 'settings' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>
                  <IconSettings className="w-6 h-6" />
                  <span className="text-[10px] font-semibold">Ajustes</span>
                </button>
              </div>
            </div>
          )}

          <Toast {...toast} onClose={() => setToast({ message: '', type: '' })} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
